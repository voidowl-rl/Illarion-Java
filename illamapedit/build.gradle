apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'maven-publish'

apply from: '../versions.gradle'

dependencies {
    implementation project(':common')
    implementation project(':engine')
    implementation group: 'net.sf.trove4j', name: 'trove4j', version: '3.0.3'
    implementation group: 'org.bushe', name: 'eventbus', version: '1.4'
    implementation group: 'com.googlecode.soundlibs', name: 'vorbisspi', version: '1.0.3.3'
    implementation group: 'com.github.insubstantial', name: 'substance', version: project.ext.insubstantialVersion
    implementation group: 'com.github.insubstantial', name: 'substance-flamingo', version: project.ext.insubstantialVersion
    implementation group: 'com.github.insubstantial', name: 'substance-swingx', version: project.ext.insubstantialVersion
    runtimeOnly group: 'org.illarion', name: 'rsc_items', version: project.ext.illarionResourcesVersion
    runtimeOnly group: 'org.illarion', name: 'rsc_music', version: project.ext.illarionResourcesVersion
    runtimeOnly group: 'org.illarion', name: 'rsc_tables', version: project.ext.illarionResourcesVersion
    runtimeOnly group: 'org.illarion', name: 'rsc_tiles', version: project.ext.illarionResourcesVersion
}

jar {
    manifest {
        attributes(
                'Main-Class': 'illarion.mapedit.MapEditor',
                'Permissions': 'all-permissions',
                'Codebase': 'illarion.org',
                'Application-Name': 'Illarion Mapeditor',
                'Application-Library-Allowable-Codebase': 'illarion.org',
                'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ssZ'),
                'Built-By': System.getProperty('user.name'),
                'Built-JDK': System.getProperty('java.version'),
                'Implementation-Title': 'Illarion Mapeditor',
                'Implementation-Vendor': 'Illarion e.V.',
                'Implementation-Version': project.ext.fullVersion
        )
    }
}
