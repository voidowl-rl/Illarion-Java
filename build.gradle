wrapper {
    gradleVersion = '7.0.2'
}

allprojects {
    apply plugin: 'idea'

    def mainVersion = findProperty('mainVersion') ?: '0.0.0.1'
    def gitBranch = findProperty('gitBranch') ?: 'local'
    def gitHash = findProperty('gitHash') ?: 'local'

    project.ext.fullVersion = mainVersion + '-' + gitHash
    project.ext.branch = gitBranch
    project.version =  mainVersion + (gitBranch == 'master' ? '' : '-SNAPSHOT')

    configurations.all {
        resolutionStrategy {
            cacheDynamicVersionsFor 10 * 60, 'seconds'
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}

subprojects {
    group = 'org.illarion'

    apply plugin: 'java'
    compileJava.options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16

    repositories {
        mavenCentral()
        maven {
            url 'https://maven.ej-technologies.com/repository'
        }
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url 'https://illarion.org/media/java/maven'
        }
        maven {
            url 'https://oss.sonatype.org/content/repositories/releases'
        }
        maven {
            url 'https://dl.bintray.com/flowtick/jgraphx'
        }
    }

    dependencies {
        implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.14.1'
        implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.14.1'
        implementation 'org.jetbrains:annotations:21.0.1'
    }
}
